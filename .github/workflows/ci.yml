name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Typecheck, tests, build, and offline acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      APP_MODE: offline
      TEST_DATABASE_URL: ""
    steps:
      # Verified upstream release commits. Keep SHA and release comment together when updating.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Validate application
        run: npm run check
      - name: Exercise the offline acceptance workflow
        run: npm run demo
      - name: Check offline configuration
        run: npm run doctor -- --offline

  postgres:
    name: PostgreSQL 17 concurrency and workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postrail_ci
          # Disposable service credential; never a repository or deployment secret.
          POSTGRES_PASSWORD: ci_only_disposable_password
          POSTGRES_DB: postrail_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postrail_ci -d postrail_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      APP_MODE: offline
      TEST_DATABASE_URL: postgresql://postrail_ci:ci_only_disposable_password@127.0.0.1:5432/postrail_ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      # This command fails instead of silently skipping when its database URL is missing.
      - name: Exercise real database connections and transactions
        run: npm run test:postgres

  container:
    name: Production image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image without publishing
        run: docker build --pull --tag postrail:ci .
