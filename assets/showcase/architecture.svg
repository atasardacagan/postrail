<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><title>Postrail — AI drafts. You decide what ships.</title><rect x="0" y="0" width="1200" height="900" rx="0" fill="#F4F2EC" stroke="none"/><g transform="translate(65,60) scale(0.71875)"><rect x="0" y="0" width="64" height="64" rx="16" fill="#355B4F" stroke="none"/><path d="M14 20H33M14 32H26M14 44H33" stroke="#D8EBCE" stroke-width="4" stroke-linecap="round"/><path d="M35 31L42 38L53 23" fill="none" stroke="#D8EBCE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="126" y="94" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" fill="#172B2B" letter-spacing="-1.2">Postrail</text><text x="65" y="170" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#172B2B" >A clear boundary between drafting and publishing.</text><rect x="65" y="235" width="302" height="145" rx="16" fill="#FFFFFF" stroke="#D7DDD4"/><text x="89" y="277" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B2B" >Scheduler</text><text x="89" y="312" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667774" >Due slots → durable jobs</text><rect x="449" y="235" width="302" height="145" rx="16" fill="#FFFFFF" stroke="#D7DDD4"/><text x="473" y="277" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B2B" >Content engine</text><text x="473" y="312" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667774" >Ideas → writer → critic</text><rect x="833" y="235" width="302" height="145" rx="16" fill="#D8EBCE" stroke="#D7DDD4"/><text x="857" y="277" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B2B" >Telegram review</text><text x="857" y="312" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667774" >Revise, postpone, cancel</text><path d="M367 305L445 305" fill="none" stroke="#355B4F" stroke-width="3"/><path d="M751 305L829 305" fill="none" stroke="#355B4F" stroke-width="3"/><rect x="833" y="461" width="302" height="145" rx="16" fill="#D8EBCE" stroke="#D7DDD4"/><text x="857" y="503" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B2B" >Human approval</text><text x="857" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667774" >Bound to the current version</text><path d="M985 380L985 457" fill="none" stroke="#DF744F" stroke-width="3"/><rect x="449" y="461" width="302" height="145" rx="16" fill="#FFFFFF" stroke="#D7DDD4"/><text x="473" y="503" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B2B" >Publisher</text><text x="473" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667774" >Official LinkedIn Posts API</text><path d="M833 532L755 532" fill="none" stroke="#355B4F" stroke-width="3"/><rect x="65" y="461" width="302" height="145" rx="16" fill="#FFFFFF" stroke="#D7DDD4"/><text x="89" y="503" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172B2B" >Outcome</text><text x="89" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667774" >Saved post + Telegram notice</text><path d="M449 532L371 532" fill="none" stroke="#355B4F" stroke-width="3"/><rect x="65" y="685" width="1070" height="102" rx="16" fill="#122425" stroke="none"/><text x="91" y="729" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F4F2EC" >PostgreSQL</text><text x="323" y="729" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B9CAC1" >Versions · Approvals · Jobs · Inbox · Outbox · Metrics</text><text x="91" y="762" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#B9CAC1" >API + worker use transactions and user-scoped queries. No Redis or n8n required.</text><text x="65" y="847" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#667774" >Measured outcomes inform future ideas. Unknown publish results pause retries.</text></svg>