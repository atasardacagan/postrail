<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><title>Postrail — AI drafts. You decide what ships.</title><rect x="0" y="0" width="1200" height="900" rx="0" fill="#F4F2EC" stroke="none"/><g transform="translate(65,70) scale(0.71875)"><rect x="0" y="0" width="64" height="64" rx="16" fill="#355B4F" stroke="none"/><path d="M14 20H33M14 32H26M14 44H33" stroke="#D8EBCE" stroke-width="4" stroke-linecap="round"/><path d="M35 31L42 38L53 23" fill="none" stroke="#D8EBCE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="126" y="104" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#172B2B" letter-spacing="-1.2">Postrail</text><text x="63" y="210" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#172B2B" letter-spacing="-3">Your voice.</text><text x="63" y="296" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#355B4F" letter-spacing="-3">Your final say.</text><text x="65" y="353" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#667774" >AI content → Telegram review → LinkedIn</text><rect x="65" y="409" width="1070" height="310" rx="22" fill="#122425" stroke="none"/><text x="96" y="457" font-family="Menlo, Consolas, monospace" font-size="15" fill="#B9CAC1">APPROVAL-BOUND WORKFLOW</text><path d="M116 541L1078 541" fill="none" stroke="#355B4F" stroke-width="4"/><circle cx="117" cy="541" r="13" fill="#DF744F"/><text x="97" y="598" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F4F2EC" >Draft v1</text><circle cx="387" cy="541" r="13" fill="#DF744F"/><text x="367" y="598" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F4F2EC" >Revise v2</text><circle cx="657" cy="541" r="13" fill="#DF744F"/><text x="637" y="598" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F4F2EC" >Review v3</text><circle cx="927" cy="541" r="13" fill="#D8EBCE"/><text x="907" y="598" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F4F2EC" >Approve v3</text><rect x="96" y="641" width="398" height="45" rx="9" fill="#355B4F" stroke="none"/><text x="115" y="671" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#D8EBCE" >No publication before approval</text><text x="677" y="671" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#B9CAC1" >3 versions · 1 fixture publication</text><text x="65" y="790" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#355B4F" letter-spacing="3">POSTRAIL</text><text x="65" y="834" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#667774" >TypeScript  ·  PostgreSQL  ·  Telegram  ·  OpenAI</text><text x="65" y="876" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#667774" >Workflow illustration based on a recorded offline run.</text></svg>