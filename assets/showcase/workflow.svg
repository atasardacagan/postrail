<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Postrail — AI drafts. You decide what ships.</title><rect x="0" y="0" width="1280" height="720" rx="0" fill="#122425" stroke="none"/><g transform="translate(45,39) scale(0.71875)"><rect x="0" y="0" width="64" height="64" rx="16" fill="#D8EBCE" stroke="none"/><path d="M14 20H33M14 32H26M14 44H33" stroke="#122425" stroke-width="4" stroke-linecap="round"/><path d="M35 31L42 38L53 23" fill="none" stroke="#122425" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="106" y="73" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#F4F2EC" letter-spacing="-1.2">Postrail</text><rect x="881" y="38" width="353" height="30" rx="15" fill="#355B4F" stroke="none"/><text x="895" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#D8EBCE" >RECORDED OFFLINE WORKFLOW</text><text x="45" y="157" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#F4F2EC" letter-spacing="-1.4">Revise the opening</text><text x="45" y="204" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9CAC1" >AI drafts. You decide what ships.</text><path d="M45 240L1235 240" fill="none" stroke="#355B4F" stroke-width="1"/><rect x="45" y="273" width="307" height="49" rx="9" fill="#122425" stroke="none"/><text x="64" y="305" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B9CAC1" >01  Schedule</text><rect x="45" y="335" width="307" height="49" rx="9" fill="#122425" stroke="none"/><text x="64" y="367" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B9CAC1" >02  Draft v1</text><rect x="45" y="397" width="307" height="49" rx="9" fill="#D8EBCE" stroke="none"/><text x="64" y="429" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172B2B" >03  Revise v2</text><rect x="45" y="459" width="307" height="49" rx="9" fill="#122425" stroke="none"/><text x="64" y="491" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B9CAC1" >04  Review v3</text><rect x="45" y="521" width="307" height="49" rx="9" fill="#122425" stroke="none"/><text x="64" y="553" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B9CAC1" >05  Approve</text><rect x="385" y="270" width="850" height="378" rx="18" fill="#F4F2EC" stroke="none"/><text x="414" y="309" font-family="Menlo, Consolas, monospace" font-size="15" fill="#355B4F">post.status = waiting_approval</text><path d="M414 329L1206 329" fill="none" stroke="#D7DDD4" stroke-width="1"/><rect x="414" y="348" width="792" height="43" rx="9" fill="#D8EBCE" stroke="none"/><text x="431" y="376" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#355B4F" >You: “girişi daha kısa ve vurucu yap”</text><text x="414" y="426" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172B2B" >Ekibiniz aynı bilgiyi neden tekrar tekrar taşıyor?</text><text x="414" y="454" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172B2B" >Talep formu dolduktan sonra kaydın kime gideceğini belirleyin. Atama</text><text x="414" y="482" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172B2B" >yapılmadığında kayıt ortak bir kutuda bekleyebilir; ekipte herkes başka</text><text x="414" y="510" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172B2B" >birinin ilgilendiğini düşünebilir.</text><text x="414" y="538" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172B2B" >Talebin durumu görünür olsun. Yanıtlanmadığında hatırlatma, yanlış ekibe</text><text x="414" y="566" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172B2B" >gittiğinde yeniden atama yolu tanımlayın.</text><text x="414" y="594" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172B2B" >Sizin ekipte ilk görünür hale getirmek istediğiniz darboğaz hangisi?</text><rect x="1010" y="594" width="195" height="30" rx="15" fill="#E6E6DF" stroke="none"/><text x="1024" y="614" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#355B4F" >PUBLISH CALLS: 0</text><text x="45" y="697" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#B9CAC1" >Real application state · fixture providers · no live post · presentation, not a product dashboard</text></svg>