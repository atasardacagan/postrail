<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Postrail — AI drafts. You decide what ships.</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F2EC" stroke="none"/><g transform="translate(72,70) scale(0.71875)"><rect x="0" y="0" width="64" height="64" rx="16" fill="#355B4F" stroke="none"/><path d="M14 20H33M14 32H26M14 44H33" stroke="#D8EBCE" stroke-width="4" stroke-linecap="round"/><path d="M35 31L42 38L53 23" fill="none" stroke="#D8EBCE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="133" y="104" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#172B2B" letter-spacing="-1.2">Postrail</text><rect x="1196" y="66" width="330" height="30" rx="15" fill="#D8EBCE" stroke="none"/><text x="1210" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#355B4F" >SELF-HOSTED · HUMAN-APPROVED</text><text x="72" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#355B4F" letter-spacing="2.5">AI LINKEDIN CONTENT</text><text x="68" y="324" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" fill="#172B2B" letter-spacing="-4">AI drafts.</text><text x="68" y="426" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" fill="#172B2B" letter-spacing="-4">You decide</text><text x="68" y="528" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" fill="#355B4F" letter-spacing="-4">what ships.</text><text x="72" y="609" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#667774" >A content engine with Telegram review,</text><text x="72" y="648" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#667774" >precise revisions and a durable publish</text><text x="72" y="687" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#667774" >queue.</text><path d="M72 748L730 748" fill="none" stroke="#D7DDD4" stroke-width="1"/><text x="72" y="791" font-family="Menlo, Consolas, monospace" font-size="18" fill="#667774">TypeScript  /  PostgreSQL  /  Telegram</text><text x="72" y="847" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667774" >Independent open source. Built around your approval.</text><rect x="836" y="170" width="692" height="582" rx="26" fill="#FFFFFF" stroke="#D7DDD4"/><text x="870" y="215" font-family="Menlo, Consolas, monospace" font-size="14" fill="#667774">RECORDED WORKFLOW · OFFLINE FIXTURES</text><path d="M870 243L1494 243" fill="none" stroke="#D7DDD4" stroke-width="1"/><text x="870" y="291" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#667774" >03</text><text x="925" y="292" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#172B2B" >Final draft</text><rect x="1312" y="268" width="182" height="30" rx="15" fill="#F4F2EC" stroke="none"/><text x="1326" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#355B4F" >AWAITING APPROVAL</text><rect x="870" y="326" width="624" height="244" rx="16" fill="#F4F2EC" stroke="none"/><text x="898" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#355B4F" >HOOK · v3</text><text x="898" y="407" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#172B2B" >Ekibiniz aynı bilgiyi neden tekrar tekrar</text><text x="898" y="444" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#172B2B" >taşıyor?</text><path d="M898 480L1464 480" fill="none" stroke="#D7DDD4" stroke-width="1"/><text x="898" y="516" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#667774" >Body preserved. CTA removed.</text><text x="898" y="547" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#667774" >The previous approval cannot publish this version.</text><rect x="870" y="597" width="252" height="65" rx="14" fill="#355B4F" stroke="none"/><text x="906" y="638" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" >You: “onayla”</text><path d="M1142 630L1206 630" fill="none" stroke="#DF744F" stroke-width="3"/><text x="1228" y="624" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172B2B" >Approved v3</text><text x="1228" y="652" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#667774" >One publish call</text><text x="870" y="712" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667774" >Live mode uses the official LinkedIn Posts API.</text><path d="M836 801L1528 801" fill="none" stroke="#D7DDD4" stroke-width="1"/><text x="836" y="840" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#667774" >DRAFT</text><text x="1000" y="840" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#667774" >REVISE</text><text x="1168" y="840" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#355B4F" >APPROVE</text><text x="1393" y="840" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#667774" >PUBLISH</text><path d="M921 835L973 835" fill="none" stroke="#D7DDD4" stroke-width="1"/><path d="M1089 835L1141 835" fill="none" stroke="#D7DDD4" stroke-width="1"/><path d="M1273 835L1365 835" fill="none" stroke="#D7DDD4" stroke-width="1"/></svg>